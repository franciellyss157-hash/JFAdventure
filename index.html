<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JFAdventure</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:Arial;
background:black;
}

#menu{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(#1a0029,#440066);
z-index:10;
}

#menu h1{
font-size:60px;
color:#d18cff;
margin-bottom:20px;
text-shadow:0 0 20px purple;
}

#menu button{
padding:15px 40px;
font-size:22px;
border:none;
border-radius:15px;
background:#8a2be2;
color:white;
box-shadow:0 0 20px purple;
}

#hud{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:22px;
display:none;
z-index:5;
background:rgba(0,0,0,0.5);
padding:10px;
border-radius:10px;
}

canvas{
display:none;
background:#4d8f4d;
}

#controls{
position:absolute;
bottom:20px;
width:100%;
display:none;
justify-content:space-between;
padding:20px;
z-index:6;
}

.ctrl{
width:70px;
height:70px;
border:none;
border-radius:50%;
background:#8a2be2;
color:white;
font-size:25px;
margin:5px;
}
</style>
</head>

<body>

<div id="menu">
<h1>JFAdventure</h1>
<button onclick="startGame()">Jogar</button>
</div>

<div id="hud">
❤️ Vidas: <span id="vidas">3</span><br>
🧟 Zumbis: <span id="zumbis">0</span><br>
🗺️ Fase: <span id="fase">1</span>
</div>

<div id="controls">
<div>
<button class="ctrl" ontouchstart="keys.left=true" ontouchend="keys.left=false">⬅️</button>
<button class="ctrl" ontouchstart="keys.right=true" ontouchend="keys.right=false">➡️</button>
<br>
<button class="ctrl" ontouchstart="keys.up=true" ontouchend="keys.up=false">⬆️</button>
<button class="ctrl" ontouchstart="keys.down=true" ontouchend="keys.down=false">⬇️</button>
</div>

<div>
<button class="ctrl" onclick="shoot()">🔫</button>
</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let fase = 1;
let vidas = 3;

const player = {
x:100,
y:300,
w:40,
h:40,
speed:5
};

const keys = {
left:false,
right:false,
up:false,
down:false
};

const bullets = [];
const zombies = [];

function spawnZombies(){

zombies.length = 0;

for(let i=0;i<fase+2;i++){

zombies.push({
x:600 + i*150,
y:300,
w:40,
h:40,
speed:1 + fase*0.2
});

}

document.getElementById("zumbis").innerText = zombies.length;
}

function startGame(){

document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="block";
document.getElementById("controls").style.display="flex";
canvas.style.display="block";

spawnZombies();

gameLoop();
}

document.addEventListener("keydown",(e)=>{

if(e.key=="a") keys.left=true;
if(e.key=="d") keys.right=true;
if(e.key=="w") keys.up=true;
if(e.key=="s") keys.down=true;

});

document.addEventListener("keyup",(e)=>{

if(e.key=="a") keys.left=false;
if(e.key=="d") keys.right=false;
if(e.key=="w") keys.up=false;
if(e.key=="s") keys.down=false;

});

function shoot(){

bullets.push({
x:player.x + 40,
y:player.y + 15,
w:15,
h:5,
speed:10
});

}

function update(){

if(keys.left) player.x -= player.speed;
if(keys.right) player.x += player.speed;
if(keys.up) player.y -= player.speed;
if(keys.down) player.y += player.speed;

bullets.forEach((bullet,bIndex)=>{

bullet.x += bullet.speed;

zombies.forEach((zombie,zIndex)=>{

if(
bullet.x < zombie.x + zombie.w &&
bullet.x + bullet.w > zombie.x &&
bullet.y < zombie.y + zombie.h &&
bullet.y + bullet.h > zombie.y
){

zombies.splice(zIndex,1);
bullets.splice(bIndex,1);

document.getElementById("zumbis").innerText = zombies.length;

}

});

});

zombies.forEach((zombie)=>{

if(zombie.x > player.x){
zombie.x -= zombie.speed;
}else{
zombie.x += zombie.speed;
}

if(zombie.y > player.y){
zombie.y -= zombie.speed;
}else{
zombie.y += zombie.speed;
}

if(
player.x < zombie.x + zombie.w &&
player.x + player.w > zombie.x &&
player.y < zombie.y + zombie.h &&
player.y + player.h > zombie.y
){

vidas--;

document.getElementById("vidas").innerText = vidas;

player.x = 100;
player.y = 300;

if(vidas <= 0){

alert("GAME OVER");
location.reload();

}

}

});

if(zombies.length == 0){

fase++;

document.getElementById("fase").innerText = fase;

if(fase > 3){

alert("VOCÊ VENCEU!");

location.reload();

}else{

spawnZombies();

}

}

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#2d5f2d";
ctx.fillRect(0,500,canvas.width,200);

ctx.fillStyle="#654321";
ctx.fillRect(300,350,100,150);

ctx.fillStyle="purple";
ctx.fillRect(1000,300,150,200);

ctx.fillStyle="#ffe0bd";
ctx.fillRect(player.x,player.y,player.w,player.h);

ctx.fillStyle="yellow";

bullets.forEach((bullet)=>{

ctx.fillRect(bullet.x,bullet.y,bullet.w,bullet.h);

});

ctx.fillStyle="green";

zombies.forEach((zombie)=>{

ctx.fillRect(zombie.x,zombie.y,zombie.w,zombie.h);

});

}

function gameLoop(){

update();
draw();

requestAnimationFrame(gameLoop);

}
</script>

</body>
</html>
